<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Jolly's Adventure</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff4500">
<style>
body{margin:0;background:#87CEEB;font-family:Arial;text-align:center;touch-action:manipulation}
h1{color:#ff4500;margin:5px;font-size:19px}
#stats{display:flex;justify-content:space-around;font-weight:bold;font-size:18px;padding:5px;background:white;border-radius:10px;margin:5px}
#gameCanvas{border:4px solid #222;border-radius:12px;background:linear-gradient(#87CEEB 0%, #E0F6FF 60%, #7AC74F 60%);max-width:95vw}
.controls{display:flex;justify-content:center;gap:10px;margin:10px}
button{padding:14px 18px;font-size:15px;font-weight:bold;border:none;border-radius:20px;color:white;flex:1;max-width:120px}
#jumpBtn{background:#ff4500} #duckBtn{background:#2196F3} #restartBtn{background:#222}
</style>
</head>
<body>
<h1>🏃 JOLLY'S ADVENTURE - HARD MODE 🔥</h1>
<div id="stats"><span id="score">Score: 0</span><span id="level">Level: 1</span><span id="lives">❤️❤️❤️</span></div>
<canvas id="gameCanvas" width="360" height="460"></canvas>
<div class="controls">
<button id="duckBtn">DUCK ⬇️</button>
<button id="jumpBtn">JUMP ⬆️</button>
<button id="restartBtn">RESTART</button>
</div>
<script>
let canvas=document.getElementById('gameCanvas'),ctx=canvas.getContext('2d');
let jolly={x:60,y:340,w:35,h:55,vy:0,ducking:false},gravity=0.85,jumpForce=-16,score=0,level=1,lives=3,gameOver=false,frame=0,runFrame=0;
let obstacles=[],coins=[],baseSpeed=4.5;
function startGame(){
 jolly.y=340;jolly.vy=0;jolly.ducking=false;obstacles=[];coins=[];score=0;level=1;lives=3;baseSpeed=4.5;frame=0;runFrame=0;gameOver=false;updateUI();requestAnimationFrame(loop);
}
function updateUI(){
 document.getElementById('score').innerText='Score: '+score;
 document.getElementById('level').innerText='Level: '+level;
 document.getElementById('lives').innerText='❤️'.repeat(Math.max(0,lives));
}
function jump(){ 
 if(gameOver || jolly.ducking) return;
 if(jolly.y>=338){ jolly.vy=jumpForce; }
}
function duckOn(){ if(!gameOver) jolly.ducking=true; }
function duckOff(){ jolly.ducking=false; }
function drawJolly(x,y){
 runFrame+= jolly.ducking?0.1:0.32;
 let legSwing=jolly.ducking?0:Math.sin(runFrame)*15;
 let armSwing=Math.sin(runFrame)*10;
 ctx.fillStyle='rgba(0,0,0,0.2)';ctx.beginPath();ctx.ellipse(x+17,y+55,18,5,0,0,Math.PI*2);ctx.fill();
 let drawY=jolly.ducking?y+20:y; let jH=jolly.ducking?35:55;
 ctx.strokeStyle='#1a1a8a';ctx.lineWidth=6;ctx.lineCap='round';
 if(!jolly.ducking){
  ctx.beginPath();ctx.moveTo(x+10,drawY+15);ctx.lineTo(x+5+legSwing,drawY+35);ctx.stroke();
  ctx.beginPath();ctx.moveTo(x+22,drawY+15);ctx.lineTo(x+25-legSwing,drawY+35);ctx.stroke();
  ctx.fillStyle='#ff4500';ctx.beginPath();ctx.ellipse(x+5+legSwing,drawY+37,10,5,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(x+25-legSwing,drawY+37,10,5,0,0,Math.PI*2);ctx.fill();
 }else{
  ctx.beginPath();ctx.moveTo(x+10,drawY+10);ctx.lineTo(x+5,drawY+30);ctx.stroke();
  ctx.beginPath();ctx.moveTo(x+22,drawY+10);ctx.lineTo(x+30,drawY+30);ctx.stroke();
 }
 ctx.fillStyle='#2196F3';ctx.fillRect(x+5,drawY,25,jolly.ducking?15:22);
 if(!jolly.ducking){ctx.fillStyle='white';ctx.font='bold 16px Arial';ctx.fillText('J',x+14,drawY+16);}
 ctx.strokeStyle='#ffdbac';ctx.lineWidth=5;
 if(!jolly.ducking){
  ctx.beginPath();ctx.moveTo(x+8,drawY+2);ctx.lineTo(x-2+armSwing,drawY+10);ctx.stroke();
  ctx.beginPath();ctx.moveTo(x+26,drawY+2);ctx.lineTo(x+32-armSwing,drawY+10);ctx.stroke();
 }
 let headY=jolly.ducking?drawY-10:drawY-12;
 ctx.fillStyle='#ffdbac';ctx.beginPath();ctx.arc(x+17,headY,12,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#222';ctx.beginPath();ctx.arc(x+17,headY-6,12,Math.PI,Math.PI*2);ctx.fill();
 ctx.fillStyle='white';ctx.beginPath();ctx.arc(x+11,headY,3.5,0,Math.PI*2);ctx.arc(x+23,headY,3.5,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='black';ctx.beginPath();ctx.arc(x+12,headY+1,1.8,0,Math.PI*2);ctx.arc(x+24,headY+1,1.8,0,Math.PI*2);ctx.fill();
 ctx.strokeStyle='#333';ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(x+17,headY+4,4,0.2,Math.PI-0.2);ctx.stroke();
}
function loop(){
 if(gameOver) return; frame++;
 ctx.clearRect(0,0,360,460);
 level=Math.floor(score/5)+1; baseSpeed=4.5+level*0.6;
 if(frame%15==0) updateUI();
 ctx.fillStyle='#7AC74F';ctx.fillRect(0,410,360,50);
 ctx.fillStyle='#5D4037';ctx.fillRect(0,410,360,8);
 jolly.vy+=gravity; jolly.y+=jolly.vy; if(jolly.y>=340){jolly.y=340;jolly.vy=0;}
 drawJolly(jolly.x,jolly.y);
 let spawnRate=Math.max(55,110-level*8);
 if(frame>80 && frame%spawnRate==0){
  let type=Math.floor(Math.random()*3); if(type==2 && level<2) type=0;
  obstacles.push({x:380,y:type==2?300:type==1?355:370,w:type==2?35:28,h:type==2?20:type==1?55:40,type:type});
  if(Math.random()>0.4) coins.push({x:385,y:280+Math.random()*60,r:10});
 }
 for(let i=coins.length-1;i>=0;i--){
  let c=coins[i]; c.x-=baseSpeed;
  ctx.fillStyle='#FFD700';ctx.beginPath();ctx.arc(c.x,c.y,10,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#FFA500';ctx.beginPath();ctx.arc(c.x,c.y,6,0,Math.PI*2);ctx.fill();
  if(jolly.x < c.x+10 && jolly.x+35 > c.x-10 && jolly.y < c.y+10 && jolly.y+55 > c.y-10){score+=2;coins.splice(i,1);continue;}
  if(c.x<-20) coins.splice(i,1);
 }
 for(let i=obstacles.length-1;i>=0;i--){
  let o=obstacles[i]; o.x-=baseSpeed;
  if(o.type==0){ctx.fillStyle='#555';ctx.beginPath();ctx.moveTo(o.x,o.y+o.h);ctx.lineTo(o.x+o.w/2,o.y);ctx.lineTo(o.x+o.w,o.y+o.h);ctx.fill();}
  else if(o.type==1){ctx.fillStyle='#8D6E63';ctx.fillRect(o.x,o.y,o.w,o.h);ctx.strokeStyle='#3E2723';ctx.lineWidth=2;ctx.strokeRect(o.x,o.y,o.w,o.h);}
  else{ctx.fillStyle='#222';ctx.beginPath();ctx.ellipse(o.x+15,o.y+10,18,10,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ff4444';ctx.beginPath();ctx.moveTo(o.x+30,o.y+10);ctx.lineTo(o.x+38,o.y+8);ctx.lineTo(o.x+30,o.y+14);ctx.fill();}
  let jY=jolly.ducking?jolly.y+20:jolly.y; let jH=jolly.ducking?35:55;
  if(jolly.x < o.x+o.w-6 && jolly.x+jolly.w > o.x+6 && jY < o.y+o.h && jY+jH > o.y){
   if(o.type==2 && jolly.ducking){}else{lives--;obstacles.splice(i,1);updateUI();if(lives<=0){gameOver=true;ctx.fillStyle='rgba(0,0,0,0.75)';ctx.fillRect(0,0,360,460);ctx.fillStyle='white';ctx.font='bold 30px Arial';ctx.fillText('GAME OVER!',65,200);ctx.font='20px Arial';ctx.fillText('Level: '+level+' Score: '+score,75,235);return;}continue;}}
  if(o.x+o.w<0){obstacles.splice(i,1);score++;}
 }
 requestAnimationFrame(loop);
}
document.getElementById('jumpBtn').addEventListener('touchstart',e=>{e.preventDefault();jump();});
document.getElementById('duckBtn').addEventListener('touchstart',e=>{e.preventDefault();duckOn();});
document.getElementById('duckBtn').addEventListener('touchend',e=>{e.preventDefault();duckOff();});
document.getElementById('duckBtn').addEventListener('mousedown',duckOn);
document.getElementById('duckBtn').addEventListener('mouseup',duckOff);
document.getElementById('restartBtn').addEventListener('click',startGame);
canvas.addEventListener('touchstart',e=>{e.preventDefault();jump();});
document.addEventListener('keydown',e=>{if(e.code=='Space'||e.code=='ArrowUp') jump(); if(e.code=='ArrowDown') duckOn();});
document.addEventListener('keyup',e=>{if(e.code=='ArrowDown') duckOff();});
startGame();
</script>
</body>
</html>
