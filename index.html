<!DOCTYPE html>
<html>
<head>
<title>JOLLY GAME - Escape From Killers</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:white;font-family:Arial;text-align:center;overflow:hidden}
.header{background:linear-gradient(red,black);padding:15px}
.header h1{font-size:28px;animation:blink 0.5s infinite}
@keyframes blink{0%{color:white}50%{color:red}}
#scoreBoard{font-size:20px;padding:10px;background:#222;color:#ffcc00}
#game{width:100%;max-width:450px;height:580px;background:linear-gradient(#111 50%,#333 50%);margin:0 auto;position:relative;overflow:hidden;border:4px solid red}
#player{position:absolute;width:45px;height:50px;bottom:80px;left:70px;font-size:42px;z-index:10;transition:0.1s}
.killer{position:absolute;font-size:45px;bottom:80px;z-index:9}
.obstacle{position:absolute;width:40px;height:40px;bottom:80px;background:#555;border-radius:5px;font-size:30px}
.ground{position:absolute;bottom:0;width:100%;height:80px;background:#222;border-top:3px solid red}
#blood{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(255,0,0,0.3);display:none;z-index:100}
.controls{padding:10px;background:#111}
.btn{padding:15px 25px;font-size:20px;border:none;border-radius:10px;font-weight:bold;margin:5px}
.jump{background:#25D366;color:white}
.start{background:#ffcc00;color:black}
.down{background:#222;color:#ffcc00;border:2px dashed #ffcc00;margin:15px auto;max-width:450px;padding:10px;border-radius:10px}
</style>
</head>
<body>
<div class="header">
<h1>😱 JOLLY GAME - ESCAPE FROM KILLERS 😱</h1>
<p>RUNNER vs KILLERS - Don't get caught!</p>
</div>
<div id="scoreBoard">Distance: 0m | Killers Escaped: 0 | Best: 0</div>
<div id="game">
<div id="blood"></div>
<div id="player">🏃</div>
<div class="ground"></div>
</div>
<div class="controls">
<button class="btn jump" onclick="jump()">⬆️ JUMP</button>
<button class="btn jump" onclick="slide()">⬇️ SLIDE</button>
<br>
<button class="btn start" onclick="startGame()">▶️ START ESCAPE</button>
<button class="btn start" onclick="location.reload()">🔄 RESTART</button>
<p style="margin-top:10px">Tap JUMP or SLIDE to escape! Killers are chasing!</p>
</div>
<div class="down">
<h3>📥 DOWNLOAD JOLLY GAME</h3>
<p>jollymunkombwe2006.github.io/jolly-game</p>
<p>Created by Jolly Munkombwe - Lusaka Zambia</p>
</div>
<script>
let player=document.getElementById('player');
let game=document.getElementById('game');
let scoreEl=document.getElementById('scoreBoard');
let blood=document.getElementById('blood');
let score=0,best=localStorage.getItem('killerBest')||0,escaped=0,isJumping=false,isSliding=false,gameOver=true,obsInterval;
scoreEl.innerText=`Distance: 0m | Escaped: 0 | Best: ${best}m`;
function startGame(){
 score=0; escaped=0; gameOver=false; 
 document.querySelectorAll('.killer,.obstacle').forEach(o=>o.remove());
 player.style.bottom='80px'; player.innerText='🏃'; player.style.height='50px';
 clearInterval(obsInterval);
 obsInterval=setInterval(createKiller,1100);
 let scoreInt=setInterval(()=>{if(!gameOver){score+=2; scoreEl.innerText=`Distance: ${score}m | Escaped: ${escaped} | Best: ${best}m`} else clearInterval(scoreInt)},100);
}
function createKiller(){
 if(gameOver) return;
 let isKiller=Math.random()>0.3;
 let el=document.createElement('div');
 el.style.left='460px';
 if(isKiller){
  el.className='killer'; 
  el.innerText=['👹','💀','🔪','👺'][Math.floor(Math.random()*4)];
 } else {
  el.className='obstacle';
  el.innerText=['🪨','📦','🔥'][Math.floor(Math.random()*3)];
 }
 game.appendChild(el);
 let pos=460;
 let speed=7+Math.random()*3;
 let move=setInterval(()=>{
  if(gameOver){clearInterval(move); return}
  pos-=speed; el.style.left=pos+'px';
  if(pos<110 && pos>50){
   let playerBottom=parseInt(player.style.bottom);
   if(!isJumping && !isSliding){
    gameOver=true; 
    player.innerText='😵'; 
    blood.style.display='block';
    setTimeout(()=>blood.style.display='none',300);
    if(score>best){best=score; localStorage.setItem('killerBest',best)}
    scoreEl.innerText=`CAUGHT! Distance: ${score}m | Best: ${best}m`;
    clearInterval(obsInterval);
    clearInterval(move);
    setTimeout(()=>alert('😱 KILLERS CAUGHT YOU! You ran '+score+'m! Escaped '+escaped+' killers!'),100);
   }
  }
  if(pos<-50){clearInterval(move); el.remove(); if(!gameOver){escaped++;}}
 },20);
}
function jump(){
 if(isJumping||isSliding||gameOver) return;
 isJumping=true; let h=0; player.innerText='🦘';
 let up=setInterval(()=>{
  h+=15; player.style.bottom=(80+h)+'px';
  if(h>150){clearInterval(up);
   let down=setInterval(()=>{
    h-=15; player.style.bottom=(80+h)+'px';
    if(h<=0){clearInterval(down); isJumping=false; player.style.bottom='80px'; player.innerText='🏃'}
   },20);
  }
 },20);
}
function slide(){
 if(isJumping||isSliding||gameOver) return;
 isSliding=true; player.innerText='🧎'; player.style.height='25px'; player.style.bottom='80px';
 setTimeout(()=>{isSliding=false; player.innerText='🏃'; player.style.height='50px'},600);
}
document.addEventListener('keydown',(e)=>{
 if(e.code=='Space'||e.code=='ArrowUp') jump();
 if(e.code=='ArrowDown') slide();
});
game.addEventListener('click',jump);
</script>
</body>
</html>the
