<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JOLLY GAME</title>
<style>
body{margin:0;background:black;color:white;text-align:center;font-family:Arial}
h1{background:red;margin:0;padding:8px;font-size:20px}
#score{color:yellow;background:#222;padding:5px}
button{padding:15px 25px;font-size:20px;margin:5px;border-radius:10px;border:none;font-weight:bold}
#game{width:95%;height:220px;background:#111;margin:auto;position:relative;border:2px solid red;overflow:hidden}
#man{position:absolute;left:20px;bottom:5px;font-size:35px}
.bad{position:absolute;right:0;bottom:5px;font-size:32px}
</style>
</head>
<body>
<h1>😱 JOLLY ESCAPE 😱</h1>
<div id="score">Score 0 | Best 0</div>
<button onclick="start()" style="background:yellow">▶️ START</button>
<button onclick="jump()" style="background:#25D366;color:white">⬆️ JUMP</button>
<div id="game"><div id="man">🏃</div></div>
<p>Tap START then JUMP to avoid 👹💀</p>
<script>
let man=document.getElementById('man'),game=document.getElementById('game'),sc=document.getElementById('score');
let score=0,best=localStorage.jbest||0,play=false,jumpin=false,t;
sc.innerText='Score 0 | Best '+best;
function start(){score=0;play=true;man.innerText='🏃';document.querySelectorAll('.bad').forEach(e=>e.remove());clearInterval(t);t=setInterval(newBad,1100)}
function newBad(){if(!play)return;let b=document.createElement('div');b.className='bad';b.innerText=['👹','💀','🔪'][score%3];game.appendChild(b);let x=0;let m=setInterval(()=>{if(!play){clearInterval(m);return}x+=7;b.style.right=x+'px';if(x>270&&x<330){if(!jumpin){play=false;clearInterval(t);man.innerText='😵';if(score>best){best=score;localStorage.jbest=best}sc.innerText='OVER! Score '+score+' Best '+best;alert('Game Over! Score '+score)}}if(x>350){clearInterval(m);b.remove()}},25);let s=setInterval(()=>{if(!play){clearInterval(s);return}score++;sc.innerText='Score '+score+' Best '+best},100)}
function jump(){if(jumpin||!play)return;jumpin=true;let h=0;let u=setInterval(()=>{h+=18;man.style.bottom=(5+h)+'px';if(h>90){clearInterval(u);let d=setInterval(()=>{h-=18;man.style.bottom=(5+h)+'px';if(h<=0){clearInterval(d);jumpin=false}},20)}},20)}
</script>
</body>
</html>
