<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Jolly's Adventure</title>
<link rel="manifest" href="manifest.json">
<style>
body{margin:0;background:linear-gradient(#87CEEB,#A8E6CF);font-family:Arial;text-align:center;touch-action:manipulation}
h1{color:#ff4500;margin:8px;font-size:22px}
#gameCanvas{border:4px solid #333;border-radius:12px;background:linear-gradient(#87CEEB 0%, #E0F6FF 60%, #90EE90 60%);}
#score{font-size:22px;font-weight:bold}
button{padding:15px 30px;font-size:20px;background:#ff4500;color:white;border:none;border-radius:25px;margin:6px;font-weight:bold}
</style>
</head>
<body>
<h1>🏃 JOLLY'S ADVENTURE 🌟</h1>
<div id="score">Score: 0</div>
<canvas id="gameCanvas" width="360" height="460"></canvas><br>
<button id="jumpBtn">JUMP ⬆️</button>
<button onclick="startGame()">RESTART 🔄</button>
<script>
let canvas=document.getElementById('gameCanvas'),ctx=canvas.getContext('2d');
let jolly={x:60,y:340,w:35,h:55,vy:0},gravity=0.7,jumpForce=-15,onGround=true,score=0,gameOver=false,runFrame=0;
let obstacles=[],frame=0;

function startGame(){
 jolly.y=340;jolly.vy=0;obstacles=[];score=0;frame=0;runFrame=0;gameOver=false;onGround=true;
 document.getElementById('score').innerText='Score: 0';loop();
}
function jump(){ if(!gameOver){jolly.vy=jumpForce;onGround=false;} }

function drawJolly(x,y){
 runFrame+=0.3;
 let legSwing=Math.sin(runFrame)*15;
 let armSwing=Math.sin(runFrame)*10;

 // shadow
 ctx.fillStyle='rgba(0,0,0,0.2)';ctx.beginPath();ctx.ellipse(x+17,y+55,18,5,0,0,Math.PI*2);ctx.fill();

 // legs - animated running
 ctx.strokeStyle='#1a1a8a';ctx.lineWidth=6;ctx.lineCap='round';
 ctx.beginPath();ctx.moveTo(x+10,y+35);ctx.lineTo(x+5+legSwing,y+52);ctx.stroke(); // left
 ctx.beginPath();ctx.moveTo(x+22,y+35);ctx.lineTo(x+25-legSwing,y+52);ctx.stroke(); // right
 // shoes
 ctx.fillStyle='#ff4500';ctx.beginPath();ctx.ellipse(x+5+legSwing,y+54,10,5,0,0,Math.PI*2);ctx.fill();
 ctx.beginPath();ctx.ellipse(x+25-legSwing,y+54,10,5,0,0,Math.PI*2);ctx.fill();

 // body - blue shirt with J
 ctx.fillStyle='#2196F3';ctx.fillRect(x+5,y+15,25,22);
 ctx.fillStyle='white';ctx.font='bold 16px Arial';ctx.fillText('J',x+14,y+31);

 // arms - animated
 ctx.strokeStyle='#ffdbac';ctx.lineWidth=5;
 ctx.beginPath();ctx.moveTo(x+8,y+18);ctx.lineTo(x-2+armSwing,y+28);ctx.stroke();
 ctx.beginPath();ctx.moveTo(x+26,y+18);ctx.lineTo(x+32-armSwing,y+28);ctx.stroke();

 // head
 ctx.fillStyle='#ffdbac';ctx.beginPath();ctx.arc(x+17,y+8,14,0,Math.PI*2);ctx.fill();
 // hair
 ctx.fillStyle='#333';ctx.beginPath();ctx.arc(x+17,y+2,14,Math.PI,Math.PI*2);ctx.fill();
 ctx.fillRect(x+3,y+2,28,4);
 // eyes
 ctx.fillStyle='white';ctx.beginPath();ctx.arc(x+11,y+9,4,0,Math.PI*2);ctx.arc(x+23,y+9,4,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='black';ctx.beginPath();ctx.arc(x+12,y+10,2,0,Math.PI*2);ctx.arc(x+24,y+10,2,0,Math.PI*2);ctx.fill();
 // smile
 ctx.strokeStyle='#333';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(x+17,y+13,5,0.2,Math.PI-0.2);ctx.stroke();

 if(!onGround){
   // jumping pose
   ctx.fillStyle='white';ctx.font='12px Arial';ctx.fillText('↑',x+30,y);
 }
}

function loop(){
 if(gameOver) return;
 frame++;ctx.clearRect(0,0,360,460);
 // clouds
 ctx.fillStyle='white';
 for(let c of [{x:50,y:50},{x:200,y:70},{x:280,y:40}]){ctx.beginPath();ctx.arc(c.x+frame%360*0.1,y=c.y,15,0,Math.PI*2);ctx.arc(c.x+15,y,20,0,Math.PI*2);ctx.arc(c.x+30,y,15,0,Math.PI*2);ctx.fill();}

 // ground
 ctx.fillStyle='#8BC34A';ctx.fillRect(0,410,360,50);
 ctx.fillStyle='#795548';ctx.fillRect(0,410,360,8);

 jolly.vy+=gravity;jolly.y+=jolly.vy;
 if(jolly.y>=340){jolly.y=340;jolly.vy=0;onGround=true}

 drawJolly(jolly.x,jolly.y);

 if(frame>120 && frame%110==0){obstacles.push({x:380,y:370,w:28,h:45,type:Math.random()>0.5?0:1})}
 for(let i=obstacles.length-1;i>=0;i--){
   let o=obstacles[i];o.x-=4.5;
   // draw obstacle - rock/crate
   if(o.type==0){ctx.fillStyle='#555';ctx.fillRect(o.x,o.y,o.w,o.h);ctx.fillStyle='#777';ctx.fillRect(o.x+3,o.y+3,o.w-6,8);}
   else{ctx.fillStyle='#8D6E63';ctx.fillRect(o.x,o.y,o.w,o.h);ctx.strokeStyle='#5D4037';ctx.lineWidth=2;ctx.strokeRect(o.x,o.y,o.w,o.h);ctx.beginPath();ctx.moveTo(o.x,o.y);ctx.lineTo(o.x+o.w,o.y+o.h);ctx.moveTo(o.x+o.w,o.y);ctx.lineTo(o.x,o.y+o.h);ctx.stroke();}

   if(jolly.x < o.x + o.w-5 && jolly.x + jolly.w > o.x+5 && jolly.y < o.y + o.h && jolly.y + jolly.h > o.y){
     gameOver=true;
     ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,0,360,460);
     ctx.fillStyle='white';ctx.font='bold 32px Arial';ctx.fillText('GAME OVER!',70,210);
     ctx.font='20px Arial';ctx.fillText('Score: '+score,130,245);
     return;
   }
   if(o.x+o.w<0){obstacles.splice(i,1);score++;document.getElementById('score').innerText='Score: '+score}
 }
 requestAnimationFrame(loop);
}
startGame();
document.getElementById('jumpBtn').addEventListener('touchstart',e=>{e.preventDefault();jump();});
document.getElementById('jumpBtn').addEventListener('click',jump);
canvas.addEventListener('touchstart',e=>{e.preventDefault();jump();});
document.addEventListener('keydown',e=>{if(e.code=='Space')jump();});
</script>
</body>
</html>
